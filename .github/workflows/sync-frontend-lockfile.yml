name: Sync frontend lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Regenerate package-lock.json on Linux
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile if changed
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(frontend): sync package-lock.json on Linux"
          file_pattern: frontend/package-lock.json
